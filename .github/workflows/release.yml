name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "themes/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Bump patch version
        id: bump
        run: echo "version=$(node scripts/bump-version.js)" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip release]"
          git push origin main
      - name: Publish extension
        run: npm run publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}" 2>/dev/null || true
          git push origin "v${{ steps.bump.outputs.version }}" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: releases/*.vsix
