name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "themes/**"
      - "snippets/**"
      - "apps/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "README.md"
      - "CHANGELOG.md"
      - "scripts/**"
  workflow_dispatch:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          !contains(github.event.head_commit.message, '[skip release]') &&
          !contains(github.event.head_commit.message, 'release:')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild sharp @resvg/resvg-js
      - run: pnpm run check
      - name: Resolve release version
        id: bump
        run: |
          MSG="${{ github.event.head_commit.message }}"
          if echo "$MSG" | grep -qiE 'release:.*v[0-9]'; then
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip_bump=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node scripts/bump-version.js)
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "skip_bump=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit version bump
        if: steps.bump.outputs.skip_bump == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip release]"
          git push origin main
      - name: Publish extension
        run: pnpm run publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          SKIP_CHECK: "1"
      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}" 2>/dev/null || true
          git push origin "v${{ steps.bump.outputs.version }}" 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: releases/*.vsix
